$kind: http-request
url: "{{base_url}}/players/999"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 404', function () {\r

      \  pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test('Response error dan data bernilai null', function () {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData.status).to.eql('error');\r

      \  pm.expect(jsonData.data).to.eql(null);\r

      });"
    language: text/javascript
order: 1000
