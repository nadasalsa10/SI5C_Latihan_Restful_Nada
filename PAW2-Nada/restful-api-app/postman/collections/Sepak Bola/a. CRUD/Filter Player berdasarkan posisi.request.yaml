$kind: http-request
url: "{{base_url}}/players?posisi=gelandang"
method: GET
queryParams:
  posisi: gelandang
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 200', function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('Semua pemain hasil filter berposisi gelandang', function () {\r

      \  const jsonData = pm.response.json();\r

      \  const players = Array.isArray(jsonData) ? jsonData : jsonData.data;\r

      \  pm.expect(players).to.be.an('array');\r

      \  pm.expect(players.length).to.be.at.least(1);\r

      \  players.forEach(function (p) {\r

      \    pm.expect(p.posisi).to.eql('gelandang');\r

      \  });\r

      });"
    language: text/javascript
order: 6000
