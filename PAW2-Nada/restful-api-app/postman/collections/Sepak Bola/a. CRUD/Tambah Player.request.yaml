$kind: http-request
url: View complete documentation/players
method: POST
headers:
  Content-Type: application/json
  x-api-key: "{{api-key}}"
body:
  type: json
  content: "{\r

    \  \"id\": 4,\r

    \  \"nama\": \"Budi Santoso\",\r

    \  \"klub\": \"Persija Jakarta\",\r

    \  \"posisi\": \"gelandang\",\r

    \  \"nomorPunggung\": 8\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test('Status code adalah 201', function () {\r

      \  pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test('Data baru memiliki id dan nama sesuai kiriman', function () {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData.status).to.eql('success');\r

      \  pm.expect(jsonData.data).to.have.property('id');\r

      \  pm.expect(jsonData.data.id).to.be.a('number');\r

      \  pm.expect(jsonData.data.nama).to.eql('Budi Santoso');\r

      });\r

      \r

      if (pm.response.code === 201) {\r

      \  pm.environment.set('playerId', pm.response.json().data.id);\r

      }"
    language: text/javascript
order: 2000
