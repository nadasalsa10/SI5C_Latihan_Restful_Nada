$kind: http-request
url: "{{base_url}}/players"
method: GET
scripts:
  - type: afterResponse
    code: "// Test script request GET: Semua Pemain\r

      pm.test(\"Status code adalah 200\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response berupa array berisi minimal 3 pemain\", () => {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData).to.be.an(\"array\");\r

      \  pm.expect(jsonData.length).to.be.at.least(3);\r

      });\r

      \r

      pm.test(\"Setiap pemain memiliki field id, nama, klub, posisi, dan nomorPunggung\", () => {\r

      \  const json = pm.response.json();\r

      \  json.forEach((p) => {\r

      \    pm.expect(p).to.include.keys(\"id\", \"nama\", \"klub\", \"posisi\", \"nomorPunggung\");\r

      \  });\r

      });\r

      \r

      pm.test(\"Data pemain pertama bernama Fajar Ramadhan\", () => {\r

      \  const jsonData = pm.response.json();\r

      \  pm.expect(jsonData[0].nama).to.eql(\"Fajar Ramadhan\");\r

      });\r

      \r\n"
    language: text/javascript
order: 1000
